
name: Git Practice

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project information
        run: |
          echo "AWS Cloud Engineer Project"
          echo "GitHub Actions is working"
          git --version

      - name: Validate project documentation
        run: |
          chmod +x scripts/validate-project.sh
          ./scripts/validate-project.sh

      - name: Run ShellCheck
        run: shellcheck scripts/validate-project.sh
